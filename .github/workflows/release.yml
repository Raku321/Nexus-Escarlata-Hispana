name: Compilar y publicar Nexus para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validar version y etiqueta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($pkg.version)" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq "push") {
            throw "La etiqueta debe coincidir con package.json"
          }

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar instalador Windows
        run: npm run dist -- --publish never

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Nexus
          path: dist/Instalador-Nexus-*.exe
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/Instalador-Nexus-*.exe --repo "${{ github.repository }}" --title "Nexus ${{ github.ref_name }}" --generate-notes --latest
