name: Compilar y publicar Nexus para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validar version y etiqueta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("${{ github.ref_type }}" -eq "tag" -and "v$($pkg.version)" -ne "${{ github.ref_name }}") {
            throw "La etiqueta debe coincidir con package.json"
          }

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar instalador Windows
        run: npm run dist -- --publish never

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Nexus
          path: dist/Instalador-Nexus-*.exe
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/Instalador-Nexus-*.exe --repo "${{ github.repository }}" --title "Nexus ${{ github.ref_name }}" --generate-notes --latest

      - name: Reemplazar instalador publico 1.0.8 autorizado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-1.0.8-fix]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "1.0.8") { throw "Solo se permite publicar 1.0.8" }
          $files = @(Get-ChildItem dist -Filter 'Instalador-Nexus-1.0.8.exe')
          if ($files.Count -ne 1) { throw "No se encontro el instalador esperado" }
          Get-FileHash $files[0].FullName -Algorithm SHA256 | Format-List
          gh release upload v1.0.8 $files[0].FullName --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Fallo al reemplazar el instalador publico" }
